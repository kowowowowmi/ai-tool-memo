<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIツール比較メモ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">AI Tool Notes</p>
          <h1>AIツール比較メモ</h1>
        </div>
        <button id="resetButton" class="secondary-button" type="button">初期状態へリセット</button>
      </header>

      <section class="panel">
        <h2>新規追加・編集</h2>
        <form id="toolForm" novalidate>
          <input type="hidden" id="editId" />
          <div class="form-grid">
            <label>
              名前
              <input id="nameInput" type="text" autocomplete="off" maxlength="40" />
            </label>
            <label>
              月額料金（円）
              <input id="monthlyInput" type="number" min="0" step="1" inputmode="numeric" />
            </label>
            <label class="memo-field">
              メモ
              <textarea id="memoInput" rows="3" maxlength="160"></textarea>
            </label>
          </div>
          <p id="formError" class="error-message" role="alert"></p>
          <div class="form-actions">
            <button id="submitButton" class="primary-button" type="submit">追加する</button>
            <button id="cancelEditButton" class="secondary-button" type="button" hidden>編集をキャンセル</button>
          </div>
        </form>
      </section>

      <section class="toolbar" aria-label="検索と並べ替え">
        <label class="search-box">
          検索
          <input id="searchInput" type="search" placeholder="名前・メモで検索" autocomplete="off" />
        </label>
        <div class="sort-controls">
          <span>料金順</span>
          <button id="sortAscButton" class="secondary-button" type="button">昇順</button>
          <button id="sortDescButton" class="secondary-button" type="button">降順</button>
        </div>
        <button id="csvButton" class="primary-button" type="button">CSVダウンロード</button>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>登録済みツール</h2>
          <p id="resultCount">0件</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>名前</th>
                <th>月額料金</th>
                <th>メモ</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="toolTableBody"></tbody>
          </table>
        </div>
        <p id="emptyMessage" class="empty-message" hidden>該当するメモはありません。</p>
      </section>

      <section class="panel">
        <h2>初期JSON</h2>
        <pre id="initialJson" class="json-box"></pre>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
